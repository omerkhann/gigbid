name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:                     # API tests use a real Postgres (gigbid_test is created by the tests)
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for the GigSim freeze check
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Assignment rule: nothing under gigsim/ may change after it is frozen.
      - name: GigSim is unchanged since its freeze tag
        run: |
          tag=$(git tag --list 'gigsim-v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then echo "No gigsim tag yet"; exit 0; fi
          echo "Comparing gigsim/ against $tag"
          git diff --exit-code --stat "$tag" HEAD -- gigsim/
      # uv installs from uv.lock and doesn't build the repo as a package
      # (pip -e failed on the multi-folder flat layout).
      - run: uv sync --locked --extra dev --extra data
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    services:
      postgres:                     # the e2e backend uses a real Postgres (fresh gigbid_e2e database)
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra data
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API client is up to date with the backend's OpenAPI schema
        run: |
          (cd ../.. && uv run python -m scripts.export_openapi)
          npx openapi-typescript openapi.json -o src/lib/api/schema.d.ts
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
          PYTHON: .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
