name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # uv installs from uv.lock and doesn't build the repo as a package
      # (pip -e failed on the multi-folder flat layout).
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
