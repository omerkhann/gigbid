name: Publish Portfolio MCP image
# Publishes the standalone Portfolio MCP server to GitHub Container Registry when a
# portfolio-mcp-v* tag is pushed (or on demand). Image: ghcr.io/<owner>/gigbid-portfolio-mcp
on:
  push:
    tags: ["portfolio-mcp-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gigbid-portfolio-mcp
          tags: |
            type=match,pattern=portfolio-mcp-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          target: portfolio-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=Read-only MCP server over a freelancer's portfolio (cited evidence search)
