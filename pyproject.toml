[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "langgraph",
  "langchain",
  "langchain-mcp-adapters",
  "mcp",
  "httpx",
  "python-dotenv",
  "tzdata>=2026.6",
  "pypdf>=7.1.0",
  "numpy>=2.4.6",
  "langchain-openai>=1.8.0",
  "langgraph-checkpoint-postgres>=3.2.1",
  "psycopg[binary]>=3.3.9",
  "psycopg-pool>=3.3.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
data = [
    "fpdf2>=2.9.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[tool.ruff]
extend-exclude = ["data"]  # generated persona repos are synthetic portfolio code, not project code
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
