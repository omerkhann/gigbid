# Production overlay for a single VM (used by infra/deploy/setup_vm.sh):
# Caddy terminates HTTPS and is the only service on public ports; the web UI is no longer published.
services:
  caddy:
    image: caddy:2.10-alpine
    profiles: [app]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]
  web:
    ports: !reset []

volumes:
  caddydata:
